<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trady · AI Copilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="/shared.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0d15;
            --card: #111a2b;
            --card-2: #172540;
            --border: #223759;
            --text: #eaf1ff;
            --muted: #9db0d2;
            --ink: #0a1322;
            --blue: #5f9dff;
            --teal: #18d6b3;
            --font: 'Manrope', sans-serif;
            --mono: 'IBM Plex Mono', monospace;
        }
        html, body { min-height: 100%; }
        body {
            background:
                radial-gradient(900px 500px at -2% -10%, rgba(95,157,255,0.24), transparent 55%),
                radial-gradient(900px 620px at 110% -15%, rgba(24,214,179,0.18), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: var(--font);
        }

        .header {
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: rgba(17,26,43,0.9);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 30;
            backdrop-filter: blur(8px);
        }
        .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 800; font-size: 17px; }
        .logo-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(145deg, var(--blue), var(--teal)); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 800; }
        .head-actions { display: inline-flex; gap: 8px; }
        .btn {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--muted);
            border-radius: 8px;
            padding: 7px 11px;
            font-family: var(--mono);
            font-size: 11px;
            cursor: pointer;
        }
        .btn:hover { color: var(--text); border-color: #3a5c95; }

        .page { max-width: 980px; margin: 0 auto; padding: 16px; }
        .hero {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(17,26,43,0.94), rgba(17,26,43,0.75));
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .hero h1 { font-size: 25px; letter-spacing: -0.4px; margin-bottom: 5px; }
        .hero p { color: var(--muted); font-size: 13px; line-height: 1.55; }

        .chat-wrap {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(23,37,64,0.92), rgba(17,26,43,0.95));
            overflow: hidden;
        }
        .chat-stream {
            min-height: 54vh;
            max-height: 62vh;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg { max-width: min(84%, 720px); padding: 10px 12px; border-radius: 12px; line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
        .msg-user { align-self: flex-end; background: linear-gradient(130deg, #2f5da0, #3c7ee0); color: #fff; }
        .msg-ai { align-self: flex-start; background: #0e1728; border: 1px solid var(--border); color: var(--text); }
        .msg-system { align-self: center; font-size: 11px; color: var(--muted); border: 1px dashed var(--border); border-radius: 999px; padding: 5px 10px; background: rgba(255,255,255,0.02); }

        .quick {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: rgba(10,19,34,0.45);
        }
        .chip { border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,0.02); color: var(--muted); font-size: 12px; padding: 6px 10px; cursor: pointer; }
        .chip:hover { color: var(--text); border-color: #3a5c95; }

        .composer {
            border-top: 1px solid var(--border);
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: end;
            background: #0f1a2f;
        }
        .composer textarea {
            width: 100%;
            min-height: 44px;
            max-height: 140px;
            resize: vertical;
            border-radius: 9px;
            border: 1px solid #315086;
            background: #0a1322;
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            padding: 10px;
        }
        .send {
            border: 1px solid #3e69ad;
            background: rgba(95,157,255,0.2);
            color: #b9d4ff;
            border-radius: 9px;
            padding: 10px 14px;
            font-family: var(--mono);
            font-size: 12px;
            cursor: pointer;
            height: 44px;
        }
        .send:hover { background: rgba(95,157,255,0.3); color: #d8e7ff; }
        .send:disabled { opacity: 0.6; cursor: not-allowed; }

        .footnote { color: var(--muted); font-size: 11px; margin-top: 8px; }

        body.embed-mode .header { display: none; }
        body.embed-mode .page { max-width: 100%; padding: 10px; }
        body.embed-mode .hero { display: none; }
        body.embed-mode .chat-stream { min-height: 58vh; max-height: 66vh; }

        @media (max-width: 760px) {
            .page { padding: 10px; }
            .hero h1 { font-size: 22px; }
            .chat-stream { min-height: 56vh; max-height: 64vh; }
            .msg { max-width: 92%; }
            .composer { grid-template-columns: 1fr; }
            .send { width: 100%; }
        }
    </style>
</head>
<body>
<header class="header">
    <a href="/" class="logo" aria-label="Trady home"><span class="logo-mark">TR</span>Trady</a>
    <div class="head-actions" style="display:inline-flex;align-items:center;gap:8px">
        <button class="theme-toggle" id="themeToggle" type="button" title="Toggle light/dark mode" aria-label="Toggle theme" style="border-color:var(--border)"><svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <button class="btn" id="newChatBtn" type="button">New Chat</button>
        <a class="btn" href="/reporting.html" style="text-decoration:none;display:inline-flex;align-items:center;">Reporting</a>
    </div>
</header>

<main class="page">
    <section class="hero">
        <h1>AI Copilot</h1>
        <p>Chat naturally about market conditions, risk, and your next steps on Trady. Your conversation is saved so you can continue later.</p>
    </section>

    <section class="chat-wrap" aria-label="Copilot chat">
        <div class="chat-stream" id="chatStream"></div>
        <div class="quick" id="quickPrompts"></div>
        <div class="composer">
            <textarea id="messageInput" placeholder="Ask Copilot anything about your current trading context..."></textarea>
            <button class="send" id="sendBtn" type="button">Send</button>
        </div>
    </section>
    <p class="footnote">Copilot gives guidance, not guarantees. Always confirm your own risk limits before entering a trade.</p>
</main>

<script>
    (function () {
        const params = new URLSearchParams(window.location.search || '');
        if (params.get('embed') === '1') {
            document.body.classList.add('embed-mode');
            document.title = 'Trady · AI Copilot (Embed)';
        }
    })();

    const STORAGE_KEY = 'trady_copilot_history_v2';
    const SESSION_KEY = 'trady_copilot_session_id_v2';
    const MAX_LOCAL_MESSAGES = 120;

    const quickPrompts = [
        'How does the market look right now and is risk normal?',
        'Give me a simple pre-trade checklist.',
        'Explain this setup for a beginner.',
        'What should make me avoid entering now?'
    ];

    const chatStream = document.getElementById('chatStream');
    const quickPromptsEl = document.getElementById('quickPrompts');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');

    let sessionId = localStorage.getItem(SESSION_KEY) || '';
    let history = [];

    function esc(s) {
        return String(s == null ? '' : s)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function scrollToBottom() {
        chatStream.scrollTop = chatStream.scrollHeight;
    }

    function saveState() {
        if (sessionId) {
            localStorage.setItem(SESSION_KEY, sessionId);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-MAX_LOCAL_MESSAGES)));
    }

    function loadState() {
        try {
            const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            history = Array.isArray(parsed) ? parsed : [];
        } catch (_) {
            history = [];
        }
    }

    function addMessage(role, content, isTransient = false) {
        const safeRole = role === 'user' ? 'user' : (role === 'assistant' ? 'assistant' : 'system');
        if (!isTransient) {
            history.push({ role: safeRole, content: String(content || '') });
            if (history.length > MAX_LOCAL_MESSAGES) history = history.slice(-MAX_LOCAL_MESSAGES);
            saveState();
        }

        const node = document.createElement('div');
        node.className = `msg ${safeRole === 'user' ? 'msg-user' : (safeRole === 'assistant' ? 'msg-ai' : 'msg-system')}`;
        node.innerHTML = esc(content || '');
        chatStream.appendChild(node);
        scrollToBottom();
        return node;
    }

    function renderHistory() {
        chatStream.innerHTML = '';
        if (!history.length) {
            addMessage('system', 'Start a conversation. I will keep it simple, practical, and risk-aware.', true);
            return;
        }
        history.forEach((m) => {
            addMessage(m.role, m.content, true);
        });
        scrollToBottom();
    }

    function renderQuickPrompts() {
        quickPromptsEl.innerHTML = quickPrompts.map((q) => `<button class="chip" type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('');
        quickPromptsEl.querySelectorAll('.chip').forEach((btn) => {
            btn.addEventListener('click', () => {
                messageInput.value = btn.getAttribute('data-q') || '';
                messageInput.focus();
            });
        });
    }

    async function maybeHydrateFromServer() {
        if (!sessionId) return;
        try {
            const r = await fetch(`/api/copilot/conversation?session_id=${encodeURIComponent(sessionId)}`);
            if (!r.ok) return;
            const payload = await r.json();
            if (!Array.isArray(payload.messages) || !payload.messages.length) return;
            if (!history.length || payload.messages.length > history.length) {
                history = payload.messages.map((m) => ({
                    role: m.role === 'user' ? 'user' : 'assistant',
                    content: String(m.content || ''),
                }));
                saveState();
                renderHistory();
            }
        } catch (_) {
            // Ignore hydration issues and continue with local history.
        }
    }

    async function sendMessage() {
        const text = String(messageInput.value || '').trim();
        if (!text) return;

        messageInput.value = '';
        addMessage('user', text);
        sendBtn.disabled = true;

        const waiting = addMessage('system', 'Copilot is thinking...', true);
        try {
            const r = await fetch('/api/copilot/converse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, session_id: sessionId || null }),
            });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);

            const payload = await r.json();
            sessionId = String(payload.session_id || sessionId || '');
            if (sessionId) localStorage.setItem(SESSION_KEY, sessionId);

            waiting.remove();
            addMessage('assistant', String(payload.message || 'I could not prepare a response right now.'));
        } catch (e) {
            waiting.remove();
            addMessage('assistant', `I had trouble answering just now (${String(e.message || e)}). Please try again.`);
        } finally {
            sendBtn.disabled = false;
            messageInput.focus();
        }
    }

    function startNewChat() {
        sessionId = '';
        history = [];
        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(STORAGE_KEY);
        renderHistory();
        messageInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    newChatBtn.addEventListener('click', startNewChat);
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    loadState();
    renderHistory();
    renderQuickPrompts();
    maybeHydrateFromServer();
</script>
<script src="/copilot_widget.js"></script>
<script src="/shared.js"></script>
</body>
</html>
